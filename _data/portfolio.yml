pillars_title: What I work on

pillars:
  - id: pillar-1
    label: "01"
    title: Clinical-grade, not leaderboard-only
    main: Most pipelines stop at benchmark scores. I build segmentation, registration, and reconstruction systems validated on real CT, MRI, and ultrasound—not just public leaderboards.
    sub: Experience at IISc, IIT Kharagpur, CfHE, and Philips Innovation Campus.
  - id: pillar-2
    label: "02"
    title: Fast to iterate and ship
    main: From self-supervised ultrasound registration to topology-aware dynamical models, I focus on reproducible training, clear evaluation, and iteration cycles measured in weeks—not months of rework.
    sub: B.Tech Data Science & Engineering, Manipal Institute of Technology · minor in Multimodal Intelligent Systems.
  - id: pillar-3
    label: "03"
    title: Impact without the noise
    main: Better diagnostics and trustworthy medical AI—robust to domain shift, documented for collaborators, and mindful of failure modes in healthcare settings.
    sub: Seeking research collaborations and roles in medical imaging, clinical ML, and computer vision.

